name: CI and Render deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cut-and-co:ci

  deploy:
    name: Deploy to Render
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy for this main branch commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"

  verify:
    name: Verify live health endpoint
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Render health endpoint
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the RENDER_SERVICE_URL Actions variable to the Render service URL."
            exit 1
          fi
          for attempt in $(seq 1 18); do
            if curl --fail --silent "$RENDER_SERVICE_URL/health" | grep -q '"status":"ok"'; then
              echo "Render health check passed."
              exit 0
            fi
            echo "Waiting for Render to finish deploying (attempt $attempt/18)..."
            sleep 10
          done
          echo "Render health check did not pass within three minutes."
          exit 1
